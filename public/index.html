<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#fffaf7" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="description" content="小米的减脂日记 —— 记录体重、饮食，还有今天吃什么" />
    <title>小米减肥日记 🍓</title>
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%F0%9F%8D%93%3C/text%3E%3C/svg%3E"
    />
    <link rel="stylesheet" href="/css/style.css" />
    <link rel="stylesheet" href="/css/animations.css" />
  </head>
  <body>
    <!-- 背景装饰 -->
    <div class="bg-deco"><div class="bg-bubbles" id="bubbles"></div></div>

    <!-- 环形进度渐变 -->
    <svg width="0" height="0" style="position: absolute" aria-hidden="true">
      <defs>
        <linearGradient id="ringGrad" x1="0%" y1="0%" x2="100%" y2="100%">
          <stop offset="0%" stop-color="#ffb7c7" />
          <stop offset="55%" stop-color="#ff8fb1" />
          <stop offset="100%" stop-color="#ffcfa8" />
        </linearGradient>
      </defs>
    </svg>

    <!-- 启动画面 -->
    <div class="boot" id="boot">
      <div class="boot__inner">
        <div class="boot__mascot">🍓</div>
        <div class="boot__text">小米减肥日记<span class="boot__dots"></span></div>
      </div>
    </div>

    <!-- 应用外壳 -->
    <div class="app-shell" id="app"></div>

    <script type="module" src="/js/app.js"></script>
  </body>
</html>
